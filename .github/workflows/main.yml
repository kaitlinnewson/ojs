on:
  push:
    branches:
      - '*'
name: ojs-main
jobs:
  ojs-v1-26.04:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.2
            validate: 'validate'
          - php-version: 8.2
            database: pgsql
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_3_0,stable-3_4_0,stable-3_5_0'
          - php-version: 8.2
            database: mariadb
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_4_0,stable-3_5_0'
          - php-version: 8.2
            database: mysql
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_3_0,stable-3_4_0,stable-3_5_0'
          - php-version: 8.3
            database: mysql
            test: 'test'
          - php-version: 8.3
            database: pgsql
            test: 'test'
          # OJS main needs PHP 8.2+, so this only shows whether PHP 7.4 installs on 26.04
          - php-version: 7.4
            database: mysql
            test: 'test'
    name: ojs-v1-26.04
    steps:
      - uses: pkp/pkp-github-actions@v1
        with:
          node_version: 20
          dataset_branch: 'main'
          DEBUG_IN_TMATE: false

  ojs-pr103-26.04:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.2
            validate: 'validate'
          - php-version: 8.2
            database: pgsql
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_3_0,stable-3_4_0,stable-3_5_0'
          - php-version: 8.2
            database: mariadb
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_4_0,stable-3_5_0'
          - php-version: 8.2
            database: mysql
            test: 'test'
            upgrade: 'upgrade'
            upgrade_test: 'stable-3_3_0,stable-3_4_0,stable-3_5_0'
          - php-version: 8.3
            database: mysql
            test: 'test'
          - php-version: 8.3
            database: pgsql
            test: 'test'
          # OJS main needs PHP 8.2+, so this only shows whether PHP 7.4 installs on 26.04
          - php-version: 7.4
            database: mysql
            test: 'test'
    name: ojs-pr103-26.04
    steps:
      - uses: kaitlinnewson/pkp-github-actions@postgres-stalls
        with:
          node_version: 20
          dataset_branch: 'main'
          DEBUG_IN_TMATE: false
